<div class="ai-chatbot-container">

    <!-- Floating Button -->
    <button id="aiToggleBtn">
        🤖
    </button>

    <!-- Chat Window -->
    <div id="aiChatWindow">

        <div class="ai-header">
            Club AI Assistant
            <span id="closeAi">✖</span>
        </div>

        <div id="aiMessages"></div>

        <div class="ai-input-area">

            <input
                type="text"
                id="aiInput"
                placeholder="Ask something..."
            />

            <button id="aiSendBtn">
                Send
            </button>

        </div>

    </div>

</div>
